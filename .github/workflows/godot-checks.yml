name: Godot checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  game-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GODOT_VERSION: 4.7.1
    steps:
      - uses: actions/checkout@v4
      - name: Install Chinese system font
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Install official Godot binary
        shell: bash
        run: |
          set -euo pipefail
          archive="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl --fail --location --retry 3 "${base}/${archive}" -o "/tmp/${archive}"
          curl --fail --location --retry 3 "${base}/SHA512-SUMS.txt" -o /tmp/SHA512-SUMS.txt
          cd /tmp
          grep " ${archive}$" SHA512-SUMS.txt | sha512sum --check --strict
          unzip -q "${archive}" -d godot
          chmod +x "godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          sudo mv "godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
      - name: Import project and run regression tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results
          failures=0
          run_godot() {
            local source="$1" log="$2"
            shift 2
            if godot --headless --path . "$@" 2>&1 | tee "$log"; then
              :
            else
              failures=1
              echo "::error file=${source}::Godot exited with an error; see ${log}"
            fi
            if grep -Eq 'SCRIPT ERROR:|^ERROR:|FAIL:' "$log"; then
              failures=1
              while IFS= read -r line; do
                line="${line//%/%25}"
                echo "::error file=${source}::${line}"
              done < <(grep -E 'SCRIPT ERROR:|^ERROR:|FAIL:' "$log" | head -n 8 || true)
            fi
          }
          run_godot project.godot test-results/import.log --editor --import --quit
          for script in \
            tests/test_service_model.gd tests/test_day_model.gd tests/test_scene.gd \
            tests/test_assets.gd tests/test_cooking_model.gd tests/test_cooking_screen.gd \
            tests/test_employee_model.gd tests/test_employee.gd tests/test_employee_comparison.gd \
            tests/test_multi_day.gd tests/test_inventory.gd tests/test_customer_choice.gd \
            tests/test_payroll.gd tests/test_multi_employee.gd tests/test_layout_equipment.gd; do
            run_godot "$script" "test-results/$(basename "$script" .gd).log" --script "$script"
          done
          exit "$failures"
      - name: Keep test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-test-logs
          path: test-results/*.log
